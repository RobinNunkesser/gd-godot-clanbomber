name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: GdUnit4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import Resources
        run: godot --headless --path . --import

      - name: Run Tests
        run: xvfb-run addons/gdUnit4/runtest.sh --godot_binary "$(which godot)" -a test
